[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slopguard"
version = "0.1.0.dev0"
description = "Triage layer for vulnerability disclosures, built for open-source maintainers being overwhelmed by AI-generated security reports."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "foudreeeee" },
]
keywords = [
    "security",
    "vulnerability-disclosure",
    "open-source",
    "ai-slop",
    "triage",
    "maintainers",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff==0.6.9",
]

[project.urls]
Homepage = "https://github.com/foudreeeee/slopguard"
Issues = "https://github.com/foudreeeee/slopguard/issues"
Documentation = "https://github.com/foudreeeee/slopguard/blob/main/docs/architecture.md"

[tool.hatch.build.targets.wheel]
packages = ["slopguard"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# schema.py is the public data contract. Its explicit Optional[...] typing is
# kept stable on purpose rather than auto-rewritten to `X | None`, so the
# public API diff stays clean. Deliberate, not an oversight.
"slopguard/schema.py" = ["UP007"]
